server {
    listen 80;
    server_name localhost;

    # 增加客户端请求体大小限制（支持大文件上传）
    client_max_body_size 1G;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # 语音 WebSocket 端点 — 必须单独配置以支持长连接
    location /api/voice/ws/ {
        proxy_pass http://api:5050/api/voice/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时（语音会话最长 5 分钟）
        proxy_read_timeout 600;
        proxy_send_timeout 600;
    }

    # 媒体流端点 — 视频/音频流式播放，需要支持 Range 请求
    location ~* /api/knowledge/databases/.*/documents/.*/stream {
        proxy_pass http://api:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_read_timeout 600;
        proxy_send_timeout 600;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_force_ranges on;
    }

    # FastAPI 接口文档代理
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://api:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:5050/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传请求超时
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }
}